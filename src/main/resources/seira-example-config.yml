# === 主程序 配置 ===
seira:
  sqlitePath: "./data/seira.db" # SQLite数据库路径，若不存在会自动创建
  directUrl: "https://seira.zcraft.xyz/direct" # 用于消息卡片中跳转游戏的按钮

# === oStella 配置 ===
ostella:
  endpoint: "http://localhost:8721" # oStella API 的地址，由 Seira 访问，默认为本地运行的 oStella 实例

# === QQ机器人 配置 ===
qq:
  appId: ""
  appSecret: ""
  # 事件订阅，33554432 是消息相关权限的总和，不建议更改
  # 具体权限可以参考 https://bot.q.qq.com/wiki/develop/api-v2/dev-prepare/interface-framework/event-emit.html
  intents: 33554432

# === 腾讯云COS 配置 ===
cos:
  secretId: ""
  secretKey: ""
  region: ""
  bucket: ""
  baseUrl: "" # 可选：自定义访问域名；留空将使用 https://<bucket>.cos.<region>.myqcloud.com
  keyPrefix: "seira" # 可选：对象前缀，默认 seira