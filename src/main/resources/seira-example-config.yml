# === 主程序 配置 ===
seira:
  # 回放文件上传路径，若不存在会自动创建
  replayPath: "./data/replays"
  # SQLite数据库路径，若不存在会自动创建
  sqlitePath: "./data/seira.db"
  # 用于消息卡片中跳转游戏的按钮
  directUrl: "https://example.com/direct"
  # 是否在群聊中发送请求已提交消息
  queueMessageInGroup: false
  # 启用调试功能与日志输出
  debugMode: false
  # 管理员用户ID列表，逗号分隔
  adminIds: [ ]
  # 新成绩监视的批量轮询间隔（分钟）
  watchIntervalMinutes: 5

# === 用户绑定配置 ===
binding:
  # 账号绑定回调监听端口
  listenPort: 8722
  # 账号绑定回调监听路径
  listenPath: "/callback"
  # 用于账号绑定的 Osu! API应用凭据
  clientId:
  clientSecret: ""

# === oStella 配置 ===
ostella:
  # oStella API 的地址，由 Seira 访问，默认为本地运行的 oStella 实例
  endpoint: "http://localhost:8721"

# === QQ机器人 配置 ===
qq:
  # 机器人的OpenID
  selfId: ""
  appId: ""
  appSecret: ""

# === 腾讯云COS 配置 ===
cos:
  secretId: ""
  secretKey: ""
  region: ""
  bucket: ""
  # 可选：自定义访问域名；留空将使用 https://<bucket>.cos.<region>.myqcloud.com
  baseUrl: ""
  # 可选：对象前缀，默认 seira
  keyPrefix: "seira"
