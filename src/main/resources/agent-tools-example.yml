# Copy to agent-tools.yml. Tools are enabled only after an explicit configuration load.
# $name maps a model argument to a query value or JSON body value (preserving its type).
# URLs and headers are operator controlled. A header value env:NAME reads the whole value
# from an environment variable (including a Bearer prefix if the server requires one).
tools: [ ]
