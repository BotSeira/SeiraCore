<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绑定成功 - Seira</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #252536;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 5px solid #ff66aa; /* osu! pink */
            animation: popIn 0.5s ease-out;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 102, 170, 0.5);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            color: #ff66aa;
            letter-spacing: 1px;
        }
        p {
            margin: 0;
            color: #b0b0c5;
            font-size: 16px;
            line-height: 1.5;
        }
        .highlight {
            color: #ffffff;
            font-weight: bold;
        }
        .sub-text {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.6;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✨</div>
    <h1>绑定成功！</h1>
    <p>已成功连接至玩家 <span class="highlight">{{USER_NAME}}</span> (ID: {{USER_ID}})</p>
    <p class="sub-text">授权已完成，你可以安全地关闭这个网页并返回聊天啦。</p>
</div>
</body>
</html>
